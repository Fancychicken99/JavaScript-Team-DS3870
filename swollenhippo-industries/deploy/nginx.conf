# Initial HTTP configuration. Certbot adds HTTPS and redirects afterward.
# Do not overwrite an existing HTTPS configuration with this template.
server {
    listen 80;
    server_name swollenhippopotamusindustries.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
